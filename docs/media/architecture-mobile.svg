<svg xmlns="http://www.w3.org/2000/svg" width="380" height="840" viewBox="0 0 380 840" role="img" aria-labelledby="title description">
  <title id="title">AISuite: one agent session, multiple frontends</title>
  <desc id="description">Native Qt, browser and custom clients connect to the AISuite bridge, then Codex app-server. Codex uses OpenAI directly or an optional local Responses adapter to the native Anthropic provider. Responses and events return through the same paths.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#458572"/></marker></defs>
  <rect x="1" y="1" width="378" height="838" rx="18" fill="#f5f9f8" stroke="#d2e2dd"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172c36">
    <text x="24" y="36" font-size="20" font-weight="700">One agent session.</text>
    <text x="24" y="62" font-size="20" font-weight="700">Multiple frontends.</text>
    <rect x="24" y="84" width="332" height="122" rx="10" fill="#fff" stroke="#cbdcd6"/>
    <text x="42" y="112" font-size="18" font-weight="700">Applications</text>
    <g font-size="17" fill="#52676f">
      <text x="42" y="139">Native Qt · CodexUI</text>
      <text x="42" y="165">Browser · CodexWUI / TS SDK</text>
      <text x="42" y="191">Custom C++ / SNode.C clients</text>
    </g>
    <rect x="24" y="246" width="332" height="124" rx="12" fill="#173b36"/>
    <text x="42" y="277" font-size="21" font-weight="700" fill="#fff">AISuite bridge</text>
    <g font-size="17" fill="#cee9df">
      <text x="42" y="307">Controller / observers</text>
      <text x="42" y="333">Request-ID routing</text>
      <text x="42" y="359">Bounded transport</text>
    </g>
    <rect x="24" y="410" width="332" height="124" rx="12" fill="#e7eefb" stroke="#bdcce8"/>
    <text x="42" y="441" font-size="21" font-weight="700">Codex app-server</text>
    <g font-size="17" fill="#415c7e">
      <text x="42" y="471">Threads and turns</text>
      <text x="42" y="497">Tools and approvals</text>
      <text x="42" y="523">Persistent history</text>
    </g>
    <rect x="24" y="574" width="332" height="66" rx="10" fill="#fff" stroke="#cbdcd6"/>
    <text x="42" y="602" font-size="19" font-weight="700">OpenAI</text>
    <text x="42" y="626" font-size="17" fill="#52676f">Direct Codex path</text>
    <rect x="24" y="654" width="332" height="124" rx="10" fill="#fff5e9" stroke="#dfc8a9"/>
    <text x="42" y="681" font-size="18" font-weight="700">Local Responses adapter</text>
    <text x="42" y="706" font-size="16" fill="#6c5b44">Optional · scoped compatibility</text>
    <text x="42" y="731" font-size="17" font-weight="700">Native Anthropic provider</text>
    <text x="42" y="755" font-size="16" fill="#6c5b44">Messages API</text>
    <g fill="none" stroke="#458572" stroke-width="2" marker-end="url(#arrow)">
      <path d="M190 206v40"/><path d="M190 370v40"/>
      <path d="M190 534v40"/><path d="M356 534h12v182h-12"/>
    </g>
    <text x="24" y="813" font-size="15" fill="#52676f">Responses and events return to clients.</text>
  </g>
</svg>
