name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  codex-build:
    runs-on: ubuntu-24.04
    container:
      image: gcc:15.3.0-trixie
      options: --cap-add=NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            ca-certificates \
            git \
            iproute2 \
            libbluetooth-dev \
            libmagic-dev \
            libssl-dev \
            ninja-build \
            nlohmann-json3-dev \
            openssl \
            pkg-config \
            procps \
            python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          getent group snodec >/dev/null || groupadd --system snodec

      - name: Enable IPv6 transport coverage
        run: |
          ip link add codex-ci-v6 type dummy
          ip link set codex-ci-v6 up
          ip -6 address add fd00::1/128 dev codex-ci-v6
          ip -6 address show dev codex-ci-v6
          getent ahostsv6 ::1

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          cmake --version
          ninja --version
          nproc

      - name: Prepare pinned SNode.C dependency
        run: |
          git init ../snodec
          git -C ../snodec remote add origin https://github.com/SNodeC/snode.c.git
          git -C ../snodec fetch --depth 1 origin \
            86992e7ead06c5790bf03a3d5280adaf14b5acb6
          git -C ../snodec checkout --detach \
            86992e7ead06c5790bf03a3d5280adaf14b5acb6
          git -C ../snodec rev-parse HEAD

      - name: Build and install pinned SNode.C dependency
        run: |
          cmake -S ../snodec -B ../snodec-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../snodec-stage" \
            -DSNODEC_BUILD_TESTS=OFF \
            -DSNODEC_BUILD_APPS=OFF
          cmake --build ../snodec-build --target all --parallel 8
          cmake --install ../snodec-build

      - name: Configure codex
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../aisuite-codex-install" \
            -DCMAKE_PREFIX_PATH="$PWD/../snodec-stage" \
            -DAISUITE_BUILD_CODEX_TESTS=ON \
            -DAISUITE_BUILD_APPS=ON

      - name: Build codex
        run: cmake --build build --parallel 8

      - name: Test codex
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/../snodec-stage/lib
        run: |
          install -d -m 0770 -g snodec \
            /etc/snode.c \
            /var/log/snode.c \
            /var/run/snode.c
          ctest --test-dir build --output-on-failure --parallel 8

      - name: Install codex
        run: cmake --install build
