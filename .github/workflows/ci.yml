name: CI

on:
  push:
    branches: [master, codex2-master]
  pull_request:

permissions:
  contents: read

jobs:
  codex2-build:
    runs-on: ubuntu-24.04
    container: gcc:15.3.0-trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            ca-certificates \
            git \
            libbluetooth-dev \
            libmagic-dev \
            libssl-dev \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            procps \
            python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          getent group snodec >/dev/null || groupadd --system snodec

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          cmake --version
          ninja --version
          nproc

      - name: Prepare accepted SNode.C 2.0.0 dependency
        run: |
          git init ../snodec
          git -C ../snodec remote add origin https://github.com/SNodeC/snode.c.git
          git -C ../snodec fetch --depth 1 origin \
            bc43179dbee2b5a0286420a61d8f1ceaef01530d
          git -C ../snodec checkout --detach FETCH_HEAD
          test "$(git -C ../snodec rev-parse HEAD)" = \
            bc43179dbee2b5a0286420a61d8f1ceaef01530d

      - name: Build and install accepted SNode.C dependency
        run: |
          cmake -S ../snodec -B ../snodec-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../snodec-stage" \
            -DSNODEC_BUILD_TESTS=OFF \
            -DSNODEC_BUILD_APPS=OFF
          cmake --build ../snodec-build --target all --parallel 8
          cmake --install ../snodec-build

      - name: Configure codex2
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../aisuite-codex2-install" \
            -DCMAKE_PREFIX_PATH="$PWD/../snodec-stage" \
            -DAISUITE_BUILD_TESTS=OFF \
            -DAISUITE_BUILD_APPS=ON \
            -DAISUITE_ENABLE_LEGACY_CODEX=OFF \
            -DAISUITE_BUILD_CODEX_FRONTEND_CLIENT=OFF

      - name: Build codex2
        run: cmake --build build --target codex-bridge --parallel 8
