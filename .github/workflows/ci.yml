name: CI
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  snodec:
    uses: SNodeC/.github/.github/workflows/verify.yml@v1.0
    secrets: inherit
  x-sdk:
    needs: [snodec, x-protocol]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions: { contents: write }
    uses: SNodeC/.github/.github/workflows/publish-dev.yml@v1.0
  x-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Verify pinned Codex protocol generation
        run: tools/regenerate-codex-protocol.sh --check
