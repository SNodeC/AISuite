name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  codex-build:
    runs-on: ubuntu-24.04
    container: gcc:15.3.0-trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake \
            ca-certificates \
            git \
            libbluetooth-dev \
            libmagic-dev \
            libssl-dev \
            ninja-build \
            nlohmann-json3-dev \
            openssl \
            pkg-config \
            procps \
            python3
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          getent group snodec >/dev/null || groupadd --system snodec

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          cmake --version
          ninja --version
          nproc

      - name: Prepare SNode.C master dependency
        run: |
          git clone --depth 1 --branch master --single-branch \
            https://github.com/SNodeC/snode.c.git ../snodec
          git -C ../snodec rev-parse HEAD

      - name: Build and install SNode.C master dependency
        run: |
          cmake -S ../snodec -B ../snodec-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../snodec-stage" \
            -DSNODEC_BUILD_TESTS=OFF \
            -DSNODEC_BUILD_APPS=OFF
          cmake --build ../snodec-build --target all --parallel 8
          cmake --install ../snodec-build

      - name: Configure codex
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$PWD/../aisuite-codex-install" \
            -DCMAKE_PREFIX_PATH="$PWD/../snodec-stage" \
            -DAISUITE_BUILD_CODEX_TESTS=ON \
            -DAISUITE_BUILD_APPS=ON

      - name: Build codex
        run: cmake --build build --parallel 8

      - name: Test codex
        run: ctest --test-dir build --output-on-failure --parallel 8

      - name: Install codex
        run: cmake --install build
